name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Source annotation contract
        run: ruff check --select ANN001,ANN003,ANN201,ANN202,ANN204 src scripts

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Pytest
        run: pytest --cov=src/goldswingtraderai --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

      - name: Financial-secret scan
        if: always()
        run: python scripts/scan_financial_secrets.py .
